name: agency_management_system
description: "Fully-offline Agency Management System for macOS and Windows desktop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  provider: ^6.1.2

  # Database (Drift / SQLite)
  drift: ^2.20.3
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Charts & formatting
  fl_chart: ^0.69.0
  intl: ^0.20.2

  # Desktop window
  window_manager: ^0.4.2

  # Backup / restore
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Preferences persistence (locale, expiry window, backup path)
  shared_preferences: ^2.3.2

  # Value equality
  equatable: ^2.0.5
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/app_logo.png

flutter_launcher_icons:
  image_path: "assets/branding/app_icon_source.png"
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
